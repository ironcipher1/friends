    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendstar Login | Welcome Back</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="script.js">
    <!-- Google Fonts for premium typography -->
    
</head>
<body>

    <div class="login-wrapper">
        <!-- Decorative Ambient Background Blobs -->
        <div class="blob blob-purple"></div>
        <div class="blob blob-blue"></div>

        <!-- Login Container Card -->
        <main class="login-card">
            <div class="brand-header">
                <div class="logo-icon">
                    <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3z"/></svg>
                </div>
                <h2>FRIENDSTAR</h2>
                <p>Enter your credentials to access login form.</p>
            </div>

            <!-- Main Interactive Form -->
            <form class="login-form" action="#" method="POST" autocomplete="off" id="form">
                <div class="input-group">
                    <label for="email">Full Name</label>
                    <div class="input-wrapper-inner">
                        <input type="text" id="fullname" placeholder="e.g Friendstar Friendstar" required>
                    </div>
                </div>

                 <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper-inner">
                        <input type="email" id="email" placeholder="name@Friendstar.com" required>
                    </div>
                </div>

                 <div class="input-group">
                    <label for="phone no">Phone No.</label>
                    <div class="input-wrapper-inner">
                        <input type="text" id="phone no" placeholder="+234........." required>
                    </div>
                </div>

                 <div class="input-group">
                    <label for="password">Create strong Password</label>
                    <div class="input-wrapper-inner">
                        <input type="text" id="text" placeholder="name@Friendstar.com" required>
                    </div>
                </div>

                 <div class="input-group">
                    <label for="password">Confirm Password</label>
                    <div class="input-wrapper-inner">
                        <input type="text" id="text" placeholder="name@Friendstar.com" required>
                    </div>
                </div>

                


                
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox"  checked>
                        <span class="checkmark"></span>
                        <p> By register you agree with <a href="">Terms</a> and <a href="">Privacy</a></p>
                    </label>
                </div>

                <button  id="submit" type="submit" class="btn-primary" > <a href="login.html"> Register Now</a>
                   
                    
                </button>
                <!-- Social SSO Provider Options -->
            <!-- <div class="divider">
                <span>Or continue with</span>
            </div>

            <div class="social-grid">
                <button type="button" class="btn-social">
                    <img src="#" alt="Google Logo">
                    Google
                </button>
                <button type="button" class="btn-social">
                    <img src="#" alt="Apple Logo" class="dark-invert">
                    Apple
                </button>
            </div> -->

            <p class="signup-footer">
                i have an account? <a href="login.html">Login Now</a>
            </p>
            </form>

            
        </div>
    </div>
    </main>
    <script src="script.js"></script>

</body>
</html>
